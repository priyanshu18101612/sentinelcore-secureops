global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Scrape Windows Host Metrics from windows_exporter
  - job_name: 'windows_exporter'
    static_configs:
      - targets: ['localhost:9182']
        labels:
          instance: 'local-workstation'
          environment: 'production-host'

  # 2. Scrape SentinelCore Spring Boot Micrometer Actuator Metrics
  - job_name: 'sentinelcore-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:8080']
        labels:
          application: 'sentinelcore-backend'

  # 3. Scrape Prometheus Self Metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 4. Genuine Network Latency & Availability Probe
  - job_name: 'blackbox-network'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - '1.1.1.1:53'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
