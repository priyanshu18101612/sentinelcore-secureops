spring.application.name=sentinelcore-backend
server.port=8080
# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/sentinelcore
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring Boot Actuator Endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# SentinelCore Real-System Telemetry Configuration
telemetry.prometheus.enabled=true
telemetry.prometheus.base-url=http://localhost:9090
telemetry.windows-exporter.base-url=http://localhost:9182
telemetry.scrape-interval-ms=15000
telemetry.host.asset-name=LOCAL-WORKSTATION-HOST
telemetry.retention.max-records=1000

# Phase 3 - Configurable Alert Anomaly Thresholds
alerts.threshold.cpu.warning=90.0
alerts.threshold.cpu.critical=95.0
alerts.threshold.memory.warning=90.0
alerts.threshold.memory.critical=95.0
alerts.threshold.disk.warning=85.0
alerts.threshold.disk.critical=92.0
alerts.threshold.network-latency.warning=50.0
alerts.threshold.network-latency.critical=100.0

# Phase 3.1 - Configurable Genuine Network Probe Target
telemetry.probe.target=1.1.1.1:53
telemetry.probe.timeout-ms=2000

# Phase 4 - Configurable Security Scanners
scanner.trivy.enabled=true
scanner.trivy.scan-path=
scanner.trivy.timeout-seconds=120
scanner.trivy.skip-dirs=node_modules,.git,target,telemetry/bin
scanner.trivy.severity=CRITICAL,HIGH,MEDIUM,LOW
scanner.sonarqube.enabled=true
scanner.sonarqube.server-url=${SONAR_HOST_URL:http://localhost:9000}
scanner.sonarqube.project-key=${SONAR_PROJECT_KEY:sentinelcore-secureops}
scanner.sonarqube.timeout-seconds=120
